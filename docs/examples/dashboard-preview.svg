  <text x="714" y="454" font-family="Consolas, monospace" font-size="10.5" fill="#e2e8f0">aov_effect = round(net_change - vol_effect, 2)</text>
  <text x="714" y="471" font-family="Consolas, monospace" font-size="10.5" fill="#38bdf8">save_result({"net_variance_usd": 398718.67, "reconciled": True})</text>
